# Sugarizer Server with MongoDB
# The Sugarizer client must be cloned next to this directory, in ../sugarizer

services:
  mongodb:
    image: mongo:8.0
    restart: always
    volumes:
      - ./docker/db:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ../sugarizer:/sugarizer-client:ro
      # optional certificates, used when https = true in env/docker.ini
      - ../:/sugarizer-certificate:ro
    ports:
      - 8080:8080
      - 8039:8039
