name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Get the Sugarizer client next to the server (settings use ../sugarizer)
        run: git clone --depth 1 https://github.com/${{ github.repository_owner }}/sugarizer ../sugarizer
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit --if-present
      - name: API tests
        run: npm test
      - name: Audit production dependencies
        # reported, not blocking: known issues are fixed by the dependency upgrade
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  e2e:
    # dashboard end-to-end tests (Playwright, Chromium), with the MongoDB service
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Get the Sugarizer client next to the server (settings use ../sugarizer)
        run: git clone --depth 1 https://github.com/${{ github.repository_owner }}/sugarizer ../sugarizer
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Dashboard end-to-end tests
        # the screenshots are saved, not compared: only the assertions of the tests can fail this step
        run: npm run test:e2e
      - name: Compare the screenshots with the baseline
        # a report, never blocking (the baseline is made on another machine, with other fonts)
        if: always()
        continue-on-error: true
        run: npm run test:e2e:compare
      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
