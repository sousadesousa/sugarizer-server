# Raspberry Pi 5 override, use it on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.pi.yml up -d
#
# MONGO_CACHE_GB sets the MongoDB WiredTiger cache (default 1, use 2 on an 8 GB Pi, 0.5 on a 2 GB one).
# The database lives in the named volume "sugarizer-db" instead of ./docker/db.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongodb:
    command: ["mongod", "--wiredTigerCacheSizeGB", "${MONGO_CACHE_GB:-1}"]
    restart: unless-stopped
    logging: *logging
    # volumes are merged by compose on the target path: !override replaces the bind mount
    volumes: !override
      - sugarizer-db:/data/db

  server:
    restart: unless-stopped
    logging: *logging
    # keep Node.js below the memory of a 4 GB Pi shared with MongoDB
    environment:
      - NODE_OPTIONS=--max-old-space-size=512

volumes:
  sugarizer-db:
